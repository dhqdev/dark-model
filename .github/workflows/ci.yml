name: CI e imagem Docker

# Push na main: testes → imagem multi-arquitetura em ghcr.io/<dono>/<repositório>:latest (e :sha-xxxxxxx)
# Tags "v1.2.3" publicam também :1.2.3 e :1.2.  Pull requests só rodam os testes.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dark
          POSTGRES_PASSWORD: dark
          POSTGRES_DB: darkmodel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dark -d darkmodel"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Backend (pytest · SQLite)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Backend (pytest · PostgreSQL)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://dark:dark@127.0.0.1:5432/darkmodel
        run: python -m pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend (tipos + build)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Sobe o sistema real (API + worker embutido) contra o simulador da OpenRouter, roda o
      # pipeline completo pela API e navega por todas as telas (computador e celular).
      - name: Pipeline completo + navegação (e2e)
        working-directory: frontend
        env:
          APP_USERNAME: admin
          APP_PASSWORD: e2e-password-123
          APP_SECRET_KEY: e2e-only-secret-key-never-used-in-production-0123456789
          OPENROUTER_API_KEY: sk-or-e2e-fake
          OPENROUTER_BASE_URL: http://127.0.0.1:9911/api/v1
          DATABASE_URL: sqlite:////tmp/e2e/dark-model.db
          DATA_DIR: /tmp/e2e
          FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
          MOTION_SIZE: 640x360
          MOTION_FPS: 15
          E2E_PASSWORD: e2e-password-123
        run: |
          npx playwright install --with-deps chromium
          mkdir -p /tmp/e2e
          (cd ../backend && nohup python -m tests.fake_openrouter --port 9911 > /tmp/fake.log 2>&1 &)
          (cd ../backend && nohup python -m app all --port 8010 > /tmp/server.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8010/api/health && break; sleep 1; done
          (cd ../backend && python scripts/seed_demo.py --url http://127.0.0.1:8010 --password "$APP_PASSWORD") || (tail -n 80 /tmp/server.log; exit 1)
          npm run test:e2e || (tail -n 80 /tmp/server.log; exit 1)

  docker:
    name: Imagem Docker
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Opcional: cadastre o secret PORTAINER_WEBHOOK_URL (webhook da stack no Portainer)
      # para o servidor baixar a imagem nova automaticamente depois do build.
      - name: Atualizar no Portainer
        if: env.PORTAINER_WEBHOOK_URL != '' && github.ref == 'refs/heads/main'
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK_URL"
